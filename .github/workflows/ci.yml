name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Validate data files
        if: ${{ !cancelled() }}
        run: npm run validate:data

      - name: Validate N5 blueprint
        if: ${{ !cancelled() }}
        run: npm run validate:blueprint

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Install isolated runner browsers
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-P0-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
