name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Validate data files
        if: ${{ !cancelled() }}
        run: npm run validate:data

      - name: Validate N5 blueprint
        if: ${{ !cancelled() }}
        run: npm run validate:blueprint

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: p1-build-${{ github.sha }}
          path: dist/
          retention-days: 14

  browser:
    name: Browser / ${{ matrix.browser }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: p1-build-${{ github.sha }}
          path: dist/
      - name: Install browser on isolated runner
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Configure isolated runner audio output
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          fi
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=japanese101_qa
          pactl set-default-sink japanese101_qa
          pactl list short sinks
      - name: P1 browser regression
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-P1-${{ matrix.browser }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
